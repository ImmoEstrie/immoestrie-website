  <!-- Icône maison dans un carré doré + texte marine -->

  <!-- Fond carré doré -->
  <rect x="0" y="8" width="44" height="44" rx="4" fill="#c9a961"/>

  <!-- Maison blanche -->
  <!-- Toit -->
  <path d="M22 16 L36 27 L36 45 L28 45 L28 36 L16 36 L16 45 L8 45 L8 27 Z" fill="#ffffff"/>
  <!-- Porte marine -->
  <rect x="17.5" y="36" width="9" height="9" rx="1" fill="#1a2744"/>
