<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dégradé ciel jour lumineux bleu -->
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="50%" stop-color="#c5dff7"/>
      <stop offset="100%" stop-color="#a0c8ef"/>
    </linearGradient>
    <!-- Nuages -->
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Fenêtres diurnes (reflets ciel) -->
    <linearGradient id="win3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8daf5"/>
      <stop offset="100%" stop-color="#7db8e8"/>
    </linearGradient>
  </defs>

  <!-- Ciel bleu diurne -->
  <rect width="1440" height="900" fill="url(#sky3)"/>

  <!-- Nuages décoratifs -->
  <ellipse cx="250" cy="120" rx="150" ry="50" fill="url(#cloud)"/>
  <ellipse cx="320" cy="105" rx="100" ry="40" fill="url(#cloud)"/>
  <ellipse cx="180" cy="110" rx="90" ry="38" fill="url(#cloud)"/>
  <ellipse cx="1100" cy="90" rx="180" ry="55" fill="url(#cloud)"/>
  <ellipse cx="1180" cy="75" rx="120" ry="45" fill="url(#cloud)"/>
  <ellipse cx="1020" cy="85" rx="100" ry="40" fill="url(#cloud)"/>
  <ellipse cx="600" cy="140" rx="120" ry="42" fill="url(#cloud)" opacity="0.7"/>

  <!-- SOL / JARDIN -->
  <rect y="720" width="1440" height="180" fill="#2d5c2a"/>
  <!-- Allée -->
  <rect x="550" y="720" width="340" height="180" fill="#8a7a60"/>
  <!-- Herbe décorative -->
  <rect y="718" width="1440" height="6" fill="#3a7a35"/>

  <!-- IMMEUBLE RÉSIDENTIEL MODERNE — CLAIR (façade blanche/beige) -->
  <!-- Corps principal -->
  <rect x="420" y="120" width="600" height="620" fill="#e8e0d5"/>
  <!-- Texture verticale (colonnes) -->
  <rect x="520" y="120" width="6" height="620" fill="#d4c9bb" opacity="0.7"/>
  <rect x="620" y="120" width="6" height="620" fill="#d4c9bb" opacity="0.7"/>
  <rect x="720" y="120" width="6" height="620" fill="#d4c9bb" opacity="0.7"/>
  <rect x="820" y="120" width="6" height="620" fill="#d4c9bb" opacity="0.7"/>
  <rect x="920" y="120" width="6" height="620" fill="#d4c9bb" opacity="0.7"/>

  <!-- Balcons (bandes horizontales) -->
  <rect x="420" y="218" width="600" height="10" fill="#c8bfb3" opacity="0.8"/>
  <rect x="430" y="218" width="580" height="4" fill="#b0a898" opacity="0.5"/>
  <rect x="420" y="318" width="600" height="10" fill="#c8bfb3" opacity="0.8"/>
  <rect x="420" y="418" width="600" height="10" fill="#c8bfb3" opacity="0.8"/>
  <rect x="420" y="518" width="600" height="10" fill="#c8bfb3" opacity="0.8"/>
  <rect x="420" y="618" width="600" height="10" fill="#c8bfb3" opacity="0.8"/>

  <!-- Garde-corps balcons (grille fine) -->
  <rect x="440" y="200" width="80" height="18" fill="none" stroke="#b0a898" stroke-width="1.5" opacity="0.7"/>
  <rect x="540" y="200" width="80" height="18" fill="none" stroke="#b0a898" stroke-width="1.5" opacity="0.7"/>
  <rect x="640" y="200" width="80" height="18" fill="none" stroke="#b0a898" stroke-width="1.5" opacity="0.7"/>
  <rect x="740" y="200" width="80" height="18" fill="none" stroke="#b0a898" stroke-width="1.5" opacity="0.7"/>
  <rect x="840" y="200" width="80" height="18" fill="none" stroke="#b0a898" stroke-width="1.5" opacity="0.7"/>
  <rect x="940" y="200" width="60" height="18" fill="none" stroke="#b0a898" stroke-width="1.5" opacity="0.7"/>

  <!-- Fenêtres (reflets ciel diurne) -->
  <!-- Rangée 1 -->
  <rect x="440" y="140" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.8"/>
  <rect x="535" y="140" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.75"/>
  <rect x="630" y="140" width="75" height="52" rx="2" fill="#c9a961" opacity="0.25"/>
  <rect x="725" y="140" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.85"/>
  <rect x="820" y="140" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.7"/>
  <rect x="915" y="140" width="80" height="52" rx="2" fill="#c9a961" opacity="0.2"/>
  <!-- Rangée 2 -->
  <rect x="440" y="240" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.7"/>
  <rect x="535" y="240" width="75" height="52" rx="2" fill="#c9a961" opacity="0.2"/>
  <rect x="630" y="240" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.8"/>
  <rect x="725" y="240" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.75"/>
  <rect x="820" y="240" width="75" height="52" rx="2" fill="#c9a961" opacity="0.25"/>
  <rect x="915" y="240" width="80" height="52" rx="2" fill="url(#win3)" opacity="0.7"/>
  <!-- Rangée 3 -->
  <rect x="440" y="340" width="75" height="52" rx="2" fill="#c9a961" opacity="0.22"/>
  <rect x="535" y="340" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.75"/>
  <rect x="630" y="340" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.8"/>
  <rect x="725" y="340" width="75" height="52" rx="2" fill="#c9a961" opacity="0.2"/>
  <rect x="820" y="340" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.72"/>
  <rect x="915" y="340" width="80" height="52" rx="2" fill="url(#win3)" opacity="0.85"/>
  <!-- Rangée 4 -->
  <rect x="440" y="440" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.78"/>
  <rect x="535" y="440" width="75" height="52" rx="2" fill="#c9a961" opacity="0.25"/>
  <rect x="630" y="440" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.7"/>
  <rect x="725" y="440" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.8"/>
  <rect x="820" y="440" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.75"/>
  <rect x="915" y="440" width="80" height="52" rx="2" fill="#c9a961" opacity="0.2"/>
  <!-- Rangée 5 -->
  <rect x="440" y="540" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.72"/>
  <rect x="535" y="540" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.8"/>
  <rect x="630" y="540" width="75" height="52" rx="2" fill="#c9a961" opacity="0.22"/>
  <rect x="725" y="540" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.75"/>
  <rect x="820" y="540" width="75" height="52" rx="2" fill="url(#win3)" opacity="0.82"/>
  <rect x="915" y="540" width="80" height="52" rx="2" fill="url(#win3)" opacity="0.7"/>

  <!-- Entrée principale -->
  <rect x="660" y="620" width="120" height="100" rx="4" fill="#c8bfb3"/>
  <rect x="672" y="630" width="44" height="80" rx="3" fill="url(#win3)" opacity="0.8"/>
  <rect x="724" y="630" width="44" height="80" rx="3" fill="url(#win3)" opacity="0.8"/>
  <!-- Auvent -->
  <rect x="630" y="610" width="180" height="14" rx="2" fill="#b0a898"/>

  <!-- Marquise numéro -->
  <rect x="695" y="690" width="50" height="20" rx="2" fill="#1a2744" opacity="0.8"/>

  <!-- Toit légèrement en pente (ligne de parapet) -->
  <rect x="410" y="108" width="620" height="16" rx="3" fill="#d0c5b5"/>
  <!-- Cheminées -->
  <rect x="500" y="80" width="18" height="32" rx="2" fill="#c0b5a5"/>
  <rect x="880" y="88" width="18" height="24" rx="2" fill="#c0b5a5"/>

  <!-- Végétation d'entrée -->
  <ellipse cx="620" cy="726" rx="35" ry="20" fill="#2a5427"/>
  <ellipse cx="820" cy="726" rx="35" ry="20" fill="#2a5427"/>
  <rect x="615" y="700" width="10" height="30" fill="#3a6e35"/>
  <rect x="815" y="700" width="10" height="30" fill="#3a6e35"/>

  <!-- Bâtiments flancs -->
  <rect x="50" y="400" width="280" height="360" fill="#d5cdc5" opacity="0.6"/>
  <rect x="1110" y="350" width="280" height="410" fill="#d5cdc5" opacity="0.6"/>
</svg>
