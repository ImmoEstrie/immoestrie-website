<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dégradé ciel lever de soleil (crépuscule doré) -->
    <linearGradient id="sky2" x1="0%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="40%" stop-color="#1e3a6e"/>
      <stop offset="75%" stop-color="#8b5e1a"/>
      <stop offset="100%" stop-color="#c9842a"/>
    </linearGradient>
    <!-- Halo soleil couchant -->
    <radialGradient id="sunGlow" cx="75%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#ffd97a" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#c9842a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c9842a" stop-opacity="0"/>
    </radialGradient>
    <!-- Fenêtres lumineuses -->
    <radialGradient id="win2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5cc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffd97a" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Ciel coucher de soleil -->
  <rect width="1440" height="900" fill="url(#sky2)"/>
